<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flappy Bird B/W</title>
<style>
  html, body { margin:0; height:100%; background:#0b0b1a; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; justify-content:center; align-items:center; }
  canvas { display:block; background:#000; outline:4px solid #ffd23f; box-shadow:0 0 40px rgba(255,107,157,.35); image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------- Setup ----------
  const W = 320, H = 480, GROUND = 430, PW = 52, CAP = 16, SPACING = 175;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let state = 'START';            // START | PLAYING | DEAD | GAMEOVER
  let paused = false;
  let score = 0, best = 0, newBest = false;
  let shake = 0, flash = 0, pop = 0, overAt = 0;
  let groundX = 0, bgX = 0, ticks = 0;
  let pipes = [], particles = [];
  try { best = +localStorage.getItem('flappyBW') || 0; } catch (e) {}

  const bird = { x: 70, y: 200, w: 20, h: 16, vy: 0, rot: 0 };

  // Background data: stars and skyline
  const stars = Array.from({ length: 45 }, () => ({
    x: Math.random() * W, y: Math.random() * (GROUND - 80),
    s: Math.random() < 0.2 ? 2 : 1, t: Math.random() * 6.28
  }));
  const TW = 420;
  const skyline = [];
  for (let x = 0; x < TW; ) {
    const w = 30 + Math.floor(Math.random() * 40), h = 40 + Math.floor(Math.random() * 90);
    skyline.push({ x, w, h });
    x += w + 4;
  }

  const GREEN = { main:'#4cd964', light:'#b6ffa8', dark:'#1e8a3c' };
  const PINK  = { main:'#ff7eb6', light:'#ffc2dc', dark:'#b3265f' };
  const INK = '#1a1033', BROWN = '#2b1b00';
  const speed = () => 2 + Math.min(score * 0.04, 1.4);

  // ---------- Sound ----------
  let AC = null, muted = false;
  function initAudio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  function tone(f1, f2, d, type = 'square', v = 0.06) {
    if (!AC || muted) return;
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d);
  }

  // ---------- Particles ----------
  function burst(x, y, n, spd, life, cols = ['#fff']) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = Math.random() * spd;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: cols[Math.floor(Math.random() * cols.length)], size: 1 + Math.floor(Math.random() * 3) });
    }
  }

  // ---------- Game logic ----------
  function flap() {
    bird.vy = -4.6;
    tone(380, 640, 0.1);
    burst(bird.x + 2, bird.y + bird.h, 4, 1.2, 18, ['#fff', '#ffe98a']);
  }

  function spawnPipe() {
    const gap = Math.max(105, 150 - score * 1.2);
    const moving = score >= 10 && Math.random() < 0.45;
    const m = moving ? 22 : 0;
    const lo = 40 + m, hi = GROUND - gap - 40 - m;
    const base = lo + Math.random() * (hi - lo);
    pipes.push({ x: W + 10, base, top: base, gap, amp: m, phase: Math.random() * 6.28, scored: false });
  }

  function die(onGround) {
    if (state === 'DEAD' || state === 'GAMEOVER') return;
    tone(240, 50, 0.35, 'sawtooth', 0.1);
    shake = 12; flash = 0.8;
    burst(bird.x + bird.w / 2, bird.y + bird.h / 2, 24, 4, 40, ['#ffd23f', '#ff9f1c', '#ff6b35', '#fff']);
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem('flappyBW', best); } catch (e) {}
    }
    if (onGround) { state = 'GAMEOVER'; overAt = performance.now(); }
    else { state = 'DEAD'; bird.vy = -2.5; }
  }

  function reset() {
    pipes = []; particles = [];
    score = 0; newBest = false;
    bird.y = 200; bird.vy = 0; bird.rot = 0;
    state = 'START';
  }

  function act() {
    initAudio();
    if (paused) { paused = false; return; }
    if (state === 'START') { state = 'PLAYING'; flap(); }
    else if (state === 'PLAYING') flap();
    else if (state === 'GAMEOVER' && performance.now() - overAt > 450) reset();
  }

  function togglePause() {
    if (paused) paused = false;
    else if (state === 'PLAYING') paused = true;
  }

  function update() {
    ticks++;
    if (shake > 0) shake *= 0.9;
    if (flash > 0) flash = Math.max(0, flash - 0.05);
    if (pop > 0) pop = Math.max(0, pop - 0.08);

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--; }
    particles = particles.filter(p => p.life > 0);

    if (paused) return;

    const spd = speed();

    if (state === 'START') {
      bird.y = 200 + Math.sin(ticks / 12) * 6;
      groundX += 2; bgX += 0.4;
    }

    if (state === 'PLAYING') {
      groundX += spd; bgX += 0.4;

      bird.vy = Math.min(bird.vy + 0.28, 8);
      bird.y += bird.vy;
      if (bird.y < 0) { bird.y = 0; bird.vy = 0; }

      if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) spawnPipe();

      const hx = bird.x + 2, hy = bird.y + 2, hw = bird.w - 4, hh = bird.h - 4;
      for (const p of pipes) {
        p.x -= spd;
        p.phase += 0.04;
        p.top = p.base + Math.sin(p.phase) * p.amp;

        if (hx + hw > p.x - 4 && hx < p.x + PW + 4) {
          if (hy < p.top || hy + hh > p.top + p.gap) die(false);
        }
        if (!p.scored && p.x + PW < bird.x) {
          p.scored = true; score++; pop = 1;
          tone(880, 1320, 0.12, 'square', 0.05);
        }
      }
      pipes = pipes.filter(p => p.x + PW + 4 > 0);

      if (bird.y + bird.h >= GROUND) { bird.y = GROUND - bird.h; die(true); }
    }
    else if (state === 'DEAD') {
      bird.vy += 0.4;
      bird.y += bird.vy;
      if (bird.y + bird.h >= GROUND) {
        bird.y = GROUND - bird.h;
        state = 'GAMEOVER'; overAt = performance.now();
        shake = 5; tone(120, 40, 0.15, 'triangle', 0.08);
      }
    }

    // Bird tilt
    const target = state === 'START' ? 0 : Math.max(-0.45, Math.min(1.3, bird.vy * 0.09));
    bird.rot += (target - bird.rot) * 0.25;
  }

  // ---------- Drawing ----------
  function txt(s, x, y, size, color = '#fff', align = 'center', outline = true) {
    ctx.font = 'bold ' + size + 'px "Courier New", monospace';
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (outline) {
      ctx.lineWidth = Math.max(3, size / 5); ctx.lineJoin = 'round';
      ctx.strokeStyle = INK; ctx.strokeText(s, x, y);
    }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#0f0c29'); g.addColorStop(0.6, '#302b63'); g.addColorStop(1, '#d4638f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,247,214,0.15)'; ctx.beginPath(); ctx.arc(250, 85, 34, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fff7d6'; ctx.beginPath(); ctx.arc(250, 85, 22, 0, 6.28); ctx.fill();

    for (const s of stars) {
      const x = ((s.x - bgX * 0.3) % W + W) % W;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * Math.sin(ticks / 30 + s.t)) + ')';
      ctx.fillRect(x, s.y, s.s, s.s);
    }

    const off = -(bgX % TW);
    for (let k = 0; k < 2; k++) {
      for (const b of skyline) {
        const x = Math.floor(b.x + off + k * TW), y = GROUND - b.h;
        ctx.fillStyle = INK; ctx.fillRect(x, y, b.w, b.h);
        for (let wy = y + 8; wy < GROUND - 8; wy += 12)
          for (let wx = x + 6; wx < x + b.w - 6; wx += 10) {
            ctx.fillStyle = ((wx - x) * 3 + (wy - y) * 5 + b.w) % 7 < 2 ? '#ffd66b' : '#2b2250';
            ctx.fillRect(wx, wy, 3, 5);
          }
      }
    }
  }

  function drawPipe(p) {
    const x = Math.floor(p.x), top = Math.floor(p.top), bot = top + p.gap;
    const c = p.amp ? PINK : GREEN;   // moving pipes are pink
    const block = (bx, by, bw, bh) => {
      ctx.fillStyle = c.main; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = c.light; ctx.fillRect(bx + 4, by, 5, bh);
      ctx.fillStyle = c.dark; ctx.fillRect(bx + bw - 10, by, 10, bh);
      ctx.fillStyle = INK; ctx.fillRect(bx, by, 2, bh); ctx.fillRect(bx + bw - 2, by, 2, bh);
    };
    block(x, 0, PW, top - CAP);
    block(x - 4, top - CAP, PW + 8, CAP);
    block(x - 4, bot, PW + 8, CAP);
    block(x, bot + CAP, PW, GROUND - bot - CAP);
    ctx.fillStyle = INK;
    ctx.fillRect(x - 4, top - CAP, PW + 8, 2); ctx.fillRect(x - 4, top - 2, PW + 8, 2);
    ctx.fillRect(x - 4, bot, PW + 8, 2); ctx.fillRect(x - 4, bot + CAP - 2, PW + 8, 2);
  }

  function drawGround() {
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#7ed957'; ctx.fillRect(0, GROUND, W, 8);
    ctx.fillStyle = '#4fae35'; ctx.fillRect(0, GROUND + 8, W, 3);
    ctx.fillStyle = INK; ctx.fillRect(0, GROUND - 2, W, 2);
    ctx.strokeStyle = '#a06a38'; ctx.lineWidth = 3;
    const o = groundX % 16;
    ctx.beginPath();
    for (let x = -16 - o; x < W + 16; x += 16) { ctx.moveTo(x + 16, GROUND + 16); ctx.lineTo(x, GROUND + 32); }
    ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(Math.floor(bird.x + bird.w / 2), Math.floor(bird.y + bird.h / 2));
    ctx.rotate(bird.rot);
    ctx.fillStyle = BROWN; ctx.fillRect(-12, -10, 24, 20); ctx.fillRect(10, -3, 9, 9);   // outline
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-10, -8, 20, 16);                             // body
    ctx.fillStyle = '#ffe98a'; ctx.fillRect(-10, -8, 20, 4);                              // highlight
    ctx.fillStyle = '#ff6b35'; ctx.fillRect(10, -1, 7, 6);                                // beak
    ctx.fillStyle = BROWN; ctx.fillRect(10, 2, 7, 1);
    ctx.fillStyle = '#fff'; ctx.fillRect(2, -7, 7, 7);                                    // eye
    ctx.fillStyle = '#000'; ctx.fillRect(6, -5, 3, 4);
    const f = state === 'GAMEOVER' || state === 'DEAD' ? 1 : Math.floor(ticks / 5) % 3;
    ctx.fillStyle = '#ff9f1c'; ctx.fillRect(-8, -2 + (f - 1) * 3, 10, 5);                 // wing
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = BROWN; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
    ctx.fillStyle = '#fff4d6'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 3; ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);
  }

  function rank() {
    return score >= 50 ? 'LEGEND' : score >= 30 ? 'MASTER' : score >= 15 ? 'PRO' : score >= 5 ? 'ROOKIE' : '-';
  }

  function drawUI() {
    const blink = Math.floor(ticks / 30) % 2 === 0;

    if (state === 'START') {
      txt('FLAPPY', W / 2, 110, 48, '#ffd23f');
      txt('BIRD', W / 2, 155, 48, '#ff6b9d');
      if (blink) txt('SPACE / CLICK / TAP', W / 2, 320, 16);
      if (best > 0) txt('BEST ' + best, W / 2, 350, 16);
    }

    if (state === 'PLAYING' || state === 'DEAD') {
      const s = 1 + pop * 0.35;
      ctx.save(); ctx.translate(W / 2, 50); ctx.scale(s, s);
      txt(String(score), 0, 0, 44);
      ctx.restore();
    }

    if (state === 'GAMEOVER') {
      const x = 45, y = 120, w = 230, h = 200;
      panel(x, y, w, h);
      txt('GAME OVER', W / 2, y + 34, 24, BROWN, 'center', false);
      txt('SCORE ' + score, W / 2, y + 74, 18, BROWN, 'center', false);
      txt('BEST  ' + best + (newBest ? ' NEW!' : ''), W / 2, y + 100, 18, BROWN, 'center', false);
      txt('RANK  ' + rank(), W / 2, y + 126, 18, BROWN, 'center', false);
      if (performance.now() - overAt > 450 && blink)
        txt('SPACE TO RETRY', W / 2, y + 166, 14, BROWN, 'center', false);
    }

    txt('P: PAUSE   M: SOUND ' + (muted ? 'OFF' : 'ON'), W / 2, H - 14, 10, '#f3e3c7', 'center', false);

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, 220, 36);
      txt('P OR SPACE TO RESUME', W / 2, 262, 12);
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawParticles();
    drawBird();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
    drawUI();
  }

  // ---------- Input ----------
  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) act();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      togglePause();
    } else if (e.code === 'KeyM') {
      muted = !muted;
    }
  });
  canvas.addEventListener('mousedown', act);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); act(); }, { passive: false });
  window.addEventListener('blur', () => { if (state === 'PLAYING') paused = true; });

  // ---------- Sizing (crisp on any screen) ----------
  function fit() {
    const s = Math.min(innerWidth / (W + 8), innerHeight / (H + 8));
    const r = Math.max(1, Math.round(s * (devicePixelRatio || 1)));
    canvas.width = W * r; canvas.height = H * r;
    canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px';
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- Loop (fixed 60 updates/sec on any monitor) ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
